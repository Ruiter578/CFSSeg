<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">研究路线选择图</title><desc id="desc">保留类增量分割基座，选择单模型机制或联邦持续分割；先验证问题，再扩实验。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="690" fill="#F7FAFF"/><text x="35" y="50" fill="#172B4D" font-size="34" font-weight="700"><tspan x="35" dy="0">保留分割基座，先证明新的问题</tspan></text><rect x="170" y="88" width="860" height="93" rx="12" fill="#2458C6"/><text x="205" y="126" fill="white" font-size="23" font-weight="550"><tspan x="205" dy="0">VOC类增量分割 + 冻结特征 + 可加和解析统计</tspan><tspan x="205" dy="37.949999999999996">共同前置：恢复权重与环境 / 固定clean协议 / 独立证据账本</tspan></text><path d="M600 181 V211 H310 V241 M600 211 H890 V241" stroke="#8EA9D8" stroke-width="3" fill="none"/><rect x="35" y="241" width="540" height="240" rx="12" fill="white" stroke="#C9D6EA"/><text x="60" y="285" fill="#087F75" font-size="28" font-weight="700"><tspan x="60" dy="0">路线A：原任务单模型</tspan></text><text x="60" y="332" fill="#172B4D" font-size="21" font-weight="400"><tspan x="60" dy="0">标签可见性 / 固定预算语义特征</tspan><tspan x="60" dy="34.65">或统计压缩：只选一个主机制</tspan><tspan x="60" dy="34.65">BOA弱信号，仅作有限复核</tspan></text><text x="60" y="454" fill="#8C5B00" font-size="20" font-weight="600"><tspan x="60" dy="0">先测瓶颈，再做3seed配对</tspan></text><rect x="625" y="241" width="540" height="240" rx="12" fill="white" stroke="#C9D6EA"/><text x="650" y="285" fill="#087F75" font-size="28" font-weight="700"><tspan x="650" dy="0">路线B：联邦持续分割</tspan></text><text x="650" y="332" fill="#172B4D" font-size="21" font-weight="400"><tspan x="650" dy="0">数据留客户端；新增空间与时间异质性</tspan><tspan x="650" dy="34.65">AFL / AFCL / FISS已存在</tspan><tspan x="650" dy="34.65">候选：背景语义冲突或统计通信成本</tspan></text><text x="650" y="454" fill="#8C5B00" font-size="20" font-weight="600"><tspan x="650" dy="0">不必换任务；必须有新增贡献</tspan></text><path d="M305 481 V510 H600 M895 481 V510 H600 V539" stroke="#8EA9D8" stroke-width="3" fill="none"/><rect x="180" y="539" width="840" height="110" rx="12" fill="#E4F3F0"/><text x="220" y="579" fill="#087F75" font-size="24" font-weight="600"><tspan x="220" dy="0">1–2周：正确性 + 问题差距 + 新颖性检验</tspan><tspan x="220" dy="39.599999999999994">通过 → 多seed/长链/第二数据集；不通过 → 归档止损</tspan></text></svg>