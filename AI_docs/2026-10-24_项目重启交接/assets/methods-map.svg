<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 900" role="img" aria-labelledby="title desc"><title id="title">SegACIL方法与结果地图</title><desc id="desc">历史基线、已完成方法、负结果、未实验候选与独立clean协议的分层总结。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1260" height="900" fill="#F7FAFF"/><text x="36" y="53" fill="#172B4D" font-size="32" font-weight="700"><tspan x="36" dy="0">从冻结特征到闭式分割：研究走到哪里</tspan></text><text x="36" y="88" fill="#172B4D" font-size="17" font-weight="400"><tspan x="36" dy="0">2026-10-24 · A=原始JSON可读，B=历史报告值；结果单位：mIoU %</tspan></text><rect x="180" y="115" width="900" height="70" rx="12" fill="#2458C6"/><text x="220" y="158" fill="white" font-size="25" font-weight="600"><tspan x="220" dy="0">DeepLab特征  →  固定RHL  →  C-RLS  →  像素类别</tspan></text><path d="M630 185 V205 H220 V225" stroke="#ACBEDC" fill="none" stroke-width="2"/><rect x="36" y="225" width="390" height="225" rx="10" fill="white" stroke="#C9D6EA"/><rect x="36" y="225" width="6" height="225" fill="#087F75"/><text x="56" y="263" fill="#087F75" font-size="25" font-weight="650"><tspan x="56" dy="0">复现与工程基座</tspan></text><text x="56" y="305" fill="#172B4D" font-size="18" font-weight="400"><tspan x="56" dy="0">V3 15-5：69.4606 / 69.5598  [A]</tspan><tspan x="56" dy="29.7">V3+ + aspp_up：70.3565  [B]</tspan><tspan x="56" dy="29.7">基线可保留；恢复权重后重放</tspan></text><text x="56" y="417" fill="#087F75" font-size="17" font-weight="550"><tspan x="56" dy="0">架构升级 ≠ 新的解析方法</tspan></text><path d="M630 185 V205 H630 V225" stroke="#ACBEDC" fill="none" stroke-width="2"/><rect x="446" y="225" width="390" height="225" rx="10" fill="white" stroke="#C9D6EA"/><rect x="446" y="225" width="6" height="225" fill="#8C5B00"/><text x="466" y="263" fill="#8C5B00" font-size="25" font-weight="650"><tspan x="466" dy="0">RHL单模型改造</tspan></text><text x="466" y="305" fill="#172B4D" font-size="18" font-weight="400"><tspan x="466" dy="0">正交BOA：69.6387  [A]</tspan><tspan x="466" dy="29.7">比同组基线 +0.0789 pp</tspan><tspan x="466" dy="29.7">只完成单点，保留有限复核</tspan></text><text x="466" y="417" fill="#8C5B00" font-size="17" font-weight="550"><tspan x="466" dy="0">反向成对：68.3424 / 68.1668</tspan></text><path d="M630 185 V205 H1040 V225" stroke="#ACBEDC" fill="none" stroke-width="2"/><rect x="856" y="225" width="390" height="225" rx="10" fill="white" stroke="#C9D6EA"/><rect x="856" y="225" width="6" height="225" fill="#A12E50"/><text x="876" y="263" fill="#A12E50" font-size="25" font-weight="650"><tspan x="876" dy="0">旧集成路线</tspan></text><text x="876" y="305" fill="#172B4D" font-size="18" font-weight="400"><tspan x="876" dy="0">P0 class-wise：69.5382  [B]</tspan><tspan x="876" dy="29.7">未超过强单模型69.5598</tspan><tspan x="876" dy="29.7">SE2.0 / Snapshot未完成</tspan></text><text x="876" y="417" fill="#A12E50" font-size="17" font-weight="550"><tspan x="876" dy="0">需求已取消 → 暂停新增实验</tspan></text><rect x="36" y="475" width="390" height="225" rx="10" fill="white" stroke="#C9D6EA"/><rect x="36" y="475" width="6" height="225" fill="#A12E50"/><text x="56" y="513" fill="#A12E50" font-size="25" font-weight="650"><tspan x="56" dy="0">归一化与像素采样</tspan></text><text x="56" y="555" fill="#172B4D" font-size="18" font-weight="400"><tspan x="56" dy="0">L2：69.4505；LN：69.4150 [A]</tspan><tspan x="56" dy="29.7">L2√d：69.3036；无有效增益</tspan><tspan x="56" dy="29.7">V3+ cap：63.7635 / 65.3718 [B]</tspan></text><text x="56" y="667" fill="#A12E50" font-size="17" font-weight="550"><tspan x="56" dy="0">保留负结果；停止重复扫描</tspan></text><rect x="446" y="475" width="390" height="225" rx="10" fill="white" stroke="#C9D6EA"/><rect x="446" y="475" width="6" height="225" fill="#A12E50"/><text x="466" y="513" fill="#A12E50" font-size="25" font-weight="650"><tspan x="466" dy="0">伪标签机制止损</tspan></text><text x="466" y="555" fill="#172B4D" font-size="18" font-weight="400"><tspan x="466" dy="0">fixed0.6：overlap 70.7731 [B]</tspan><tspan x="466" dy="29.7">类别阈值净增益仅 +0.0020 pp</tspan><tspan x="466" dy="29.7">W1均值 +0.0190 / +0.0339 pp</tspan></text><text x="466" y="667" fill="#A12E50" font-size="17" font-weight="550"><tspan x="466" dy="0">辅助伪标签保留；阈值/W1冻结</tspan></text><rect x="856" y="475" width="390" height="225" rx="10" fill="white" stroke="#C9D6EA"/><rect x="856" y="475" width="6" height="225" fill="#8C5B00"/><text x="876" y="513" fill="#8C5B00" font-size="25" font-weight="650"><tspan x="876" dy="0">尚未成立的方法</tspan></text><text x="876" y="555" fill="#172B4D" font-size="18" font-weight="400"><tspan x="876" dy="0">PGH / PowerNorm / CA-C-RLS</tspan><tspan x="876" dy="29.7">大多仍是设计或零散基础代码</tspan><tspan x="876" dy="29.7">soft target / 联邦：没有本仓结果</tspan></text><text x="876" y="667" fill="#8C5B00" font-size="17" font-weight="550"><tspan x="876" dy="0">先提出可证伪假设，再写新代码</tspan></text><rect x="36" y="752" width="1210" height="119" rx="10" fill="#E6EEFE"/><text x="58" y="785" fill="#2458C6" font-size="23" font-weight="700"><tspan x="58" dy="0">独立clean holdout：不能与上面的历史约70%横向比较</tspan></text><text x="58" y="823" fill="#172B4D" font-size="18" font-weight="400"><tspan x="58" dy="0">E1.1 decoder均值59.6412 &gt; aspp59.1228 [A]；E1.2 eps1e-3=59.7310，eps0/1e-4均未提升。</tspan><tspan x="58" dy="29.7">现有191份二维JSON + 110条历史汇总记录有重叠；当前checkout没有模型权重。</tspan></text></svg>