<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1660" role="img" aria-labelledby="title desc"><title id="title">基于闭式解的解析持续学习：方法与结果</title><desc id="desc">按相同任务协议比较各方法最优结果与CFSSeg论文结果。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1440" height="1660" fill="#f7faff"/><text x="36" y="55" fill="#172b4d" font-size="36" font-weight="700">基于闭式解的解析持续学习</text><text x="36" y="91" fill="#4f617c" font-size="22" font-weight="400">冻结表示 → RHL随机特征 → C-RLS解析分类头</text><rect x="36" y="118" width="1368" height="85" rx="10" fill="#172b4d"/><text x="60" y="152" fill="white" font-size="23" font-weight="600">CFSSeg论文：sequential 15-5 / 15-1 = 70.00%；overlap 15-1 = 69.36%</text><text x="60" y="184" fill="#dce8ff" font-size="18" font-weight="400">下列Δ均与同协议论文all比较；15-5 overlap/disjoint及clean在论文中未报告。</text><rect x="36" y="229" width="440" height="235" rx="9" fill="white" stroke="#c9d6ea"/><rect x="36" y="229" width="5" height="235" fill="#2458c6"/><text x="57" y="262" fill="#2458c6" font-size="25" font-weight="700">CFSSeg</text><text x="57" y="294" fill="#172b4d" font-size="20" font-weight="400">原方法复现</text><text x="57" y="341" fill="#2458c6" font-size="32" font-weight="700">69.6015%<tspan baseline-shift="super" font-size="60%">*</tspan></text><text x="57" y="376" fill="#2458c6" font-size="20" font-weight="550">较论文 −0.3985 pp</text><text x="57" y="404" fill="#4f617c" font-size="16" font-weight="400">15-5 sequential</text><text x="57" y="439" fill="#172b4d" font-size="18" font-weight="400">复现性能接近，batch改变有小幅波动</text><rect x="500" y="229" width="440" height="235" rx="9" fill="white" stroke="#c9d6ea"/><rect x="500" y="229" width="5" height="235" fill="#8c5b00"/><text x="521" y="262" fill="#8c5b00" font-size="25" font-weight="700">Buffer / γ</text><text x="521" y="294" fill="#172b4d" font-size="20" font-weight="400">维度与正则搜索</text><text x="521" y="341" fill="#8c5b00" font-size="32" font-weight="700">70.0157%<tspan baseline-shift="super" font-size="60%">*</tspan></text><text x="521" y="376" fill="#8c5b00" font-size="20" font-weight="550">较论文 +0.0157 pp</text><text x="521" y="404" fill="#4f617c" font-size="16" font-weight="400">15-5 sequential</text><text x="521" y="439" fill="#172b4d" font-size="18" font-weight="400">单次接近论文，更多收益来自参数选择</text><rect x="964" y="229" width="440" height="235" rx="9" fill="white" stroke="#c9d6ea"/><rect x="964" y="229" width="5" height="235" fill="#a12e50"/><text x="985" y="262" fill="#a12e50" font-size="25" font-weight="700">RHL-Norm</text><text x="985" y="294" fill="#172b4d" font-size="20" font-weight="400">随机特征归一化</text><text x="985" y="341" fill="#a12e50" font-size="32" font-weight="700">69.5146%<tspan baseline-shift="super" font-size="60%">*</tspan></text><text x="985" y="376" fill="#a12e50" font-size="20" font-weight="550">较论文 −0.4854 pp</text><text x="985" y="404" fill="#4f617c" font-size="16" font-weight="400">15-5 sequential</text><text x="985" y="439" fill="#172b4d" font-size="18" font-weight="400">强归一化没有带来有效提升</text><rect x="36" y="486" width="440" height="235" rx="9" fill="white" stroke="#c9d6ea"/><rect x="36" y="486" width="5" height="235" fill="#8c5b00"/><text x="57" y="519" fill="#8c5b00" font-size="25" font-weight="700">BOA-RHL</text><text x="57" y="551" fill="#172b4d" font-size="20" font-weight="400">分块正交随机映射</text><text x="57" y="598" fill="#8c5b00" font-size="32" font-weight="700">69.6387%<tspan baseline-shift="super" font-size="60%">*</tspan></text><text x="57" y="633" fill="#8c5b00" font-size="20" font-weight="550">较论文 −0.3613 pp</text><text x="57" y="661" fill="#4f617c" font-size="16" font-weight="400">15-5 sequential</text><text x="57" y="696" fill="#172b4d" font-size="18" font-weight="400">正交比同组基线略好，反向成对下降</text><rect x="500" y="486" width="440" height="235" rx="9" fill="white" stroke="#c9d6ea"/><rect x="500" y="486" width="5" height="235" fill="#a12e50"/><text x="521" y="519" fill="#a12e50" font-size="25" font-weight="700">RHL-SE</text><text x="521" y="551" fill="#172b4d" font-size="20" font-weight="400">随机隐层集成</text><text x="521" y="598" fill="#a12e50" font-size="32" font-weight="700">69.5386%</text><text x="521" y="633" fill="#a12e50" font-size="20" font-weight="550">较论文 −0.4614 pp</text><text x="521" y="661" fill="#4f617c" font-size="16" font-weight="400">15-5 sequential</text><text x="521" y="696" fill="#172b4d" font-size="18" font-weight="400">没有超过强单模型，暂停扩展</text><rect x="964" y="486" width="440" height="235" rx="9" fill="white" stroke="#c9d6ea"/><rect x="964" y="486" width="5" height="235" fill="#087f75"/><text x="985" y="519" fill="#087f75" font-size="25" font-weight="700">DLV3+</text><text x="985" y="551" fill="#172b4d" font-size="20" font-weight="400">架构与特征源升级</text><text x="985" y="598" fill="#087f75" font-size="32" font-weight="700">70.3565%</text><text x="985" y="633" fill="#087f75" font-size="20" font-weight="550">较论文 +0.3565 pp</text><text x="985" y="661" fill="#4f617c" font-size="16" font-weight="400">15-5 sequential</text><text x="985" y="696" fill="#172b4d" font-size="18" font-weight="400">上采样语义特征改善新类识别</text><rect x="36" y="743" width="440" height="235" rx="9" fill="white" stroke="#c9d6ea"/><rect x="36" y="743" width="5" height="235" fill="#a12e50"/><text x="57" y="776" fill="#a12e50" font-size="25" font-weight="700">Class-cap</text><text x="57" y="808" fill="#172b4d" font-size="20" font-weight="400">类别像素限额采样</text><text x="57" y="855" fill="#a12e50" font-size="32" font-weight="700">65.3718%</text><text x="57" y="890" fill="#a12e50" font-size="20" font-weight="550">较论文 −4.6282 pp</text><text x="57" y="918" fill="#4f617c" font-size="16" font-weight="400">15-5 sequential</text><text x="57" y="953" fill="#172b4d" font-size="18" font-weight="400">新类提高，但旧类损失过大</text><rect x="500" y="743" width="440" height="235" rx="9" fill="white" stroke="#c9d6ea"/><rect x="500" y="743" width="5" height="235" fill="#087f75"/><text x="521" y="776" fill="#087f75" font-size="25" font-weight="700">FPL</text><text x="521" y="808" fill="#172b4d" font-size="20" font-weight="400">固定阈值伪标签</text><text x="521" y="855" fill="#087f75" font-size="32" font-weight="700">70.7731%</text><text x="521" y="890" fill="#087f75" font-size="20" font-weight="550">15-5 overlap：论文未报告</text><text x="521" y="918" fill="#4f617c" font-size="16" font-weight="400">15-1：70.4120%，较论文+1.0520 pp</text><text x="521" y="953" fill="#172b4d" font-size="18" font-weight="400">补回旧类标签，长链增益持续</text><rect x="964" y="743" width="440" height="235" rx="9" fill="white" stroke="#c9d6ea"/><rect x="964" y="743" width="5" height="235" fill="#8c5b00"/><text x="985" y="776" fill="#8c5b00" font-size="25" font-weight="700">APT</text><text x="985" y="808" fill="#172b4d" font-size="20" font-weight="400">自适应类别阈值</text><text x="985" y="855" fill="#8c5b00" font-size="32" font-weight="700">70.8082%</text><text x="985" y="890" fill="#8c5b00" font-size="20" font-weight="550">论文同协议未报告</text><text x="985" y="918" fill="#4f617c" font-size="16" font-weight="400">15-5 overlap</text><text x="985" y="953" fill="#172b4d" font-size="18" font-weight="400">收益主要来自覆盖率，类别阈值贡献小</text><rect x="36" y="1000" width="440" height="235" rx="9" fill="white" stroke="#c9d6ea"/><rect x="36" y="1000" width="5" height="235" fill="#8c5b00"/><text x="57" y="1033" fill="#8c5b00" font-size="25" font-weight="700">BGQ</text><text x="57" y="1065" fill="#172b4d" font-size="20" font-weight="400">批内全局分位阈值</text><text x="57" y="1112" fill="#8c5b00" font-size="32" font-weight="700">70.7358%</text><text x="57" y="1147" fill="#8c5b00" font-size="20" font-weight="550">论文同协议未报告</text><text x="57" y="1175" fill="#4f617c" font-size="16" font-weight="400">15-5 overlap</text><text x="57" y="1210" fill="#172b4d" font-size="18" font-weight="400">低分位更好，仍不及固定阈值</text><rect x="500" y="1000" width="440" height="235" rx="9" fill="white" stroke="#c9d6ea"/><rect x="500" y="1000" width="5" height="235" fill="#8c5b00"/><text x="521" y="1033" fill="#8c5b00" font-size="25" font-weight="700">BCQ</text><text x="521" y="1065" fill="#172b4d" font-size="20" font-weight="400">批内类别分位阈值</text><text x="521" y="1112" fill="#8c5b00" font-size="32" font-weight="700">70.7694%</text><text x="521" y="1147" fill="#8c5b00" font-size="20" font-weight="550">论文同协议未报告</text><text x="521" y="1175" fill="#4f617c" font-size="16" font-weight="400">15-5 overlap</text><text x="521" y="1210" fill="#172b4d" font-size="18" font-weight="400">按类分组略改善，未超过固定阈值</text><rect x="964" y="1000" width="440" height="235" rx="9" fill="white" stroke="#c9d6ea"/><rect x="964" y="1000" width="5" height="235" fill="#8c5b00"/><text x="985" y="1033" fill="#8c5b00" font-size="25" font-weight="700">MG</text><text x="985" y="1065" fill="#172b4d" font-size="20" font-weight="400">匹配总体分位点的全局阈值</text><text x="985" y="1112" fill="#8c5b00" font-size="32" font-weight="700">70.8038%</text><text x="985" y="1147" fill="#8c5b00" font-size="20" font-weight="550">论文同协议未报告</text><text x="985" y="1175" fill="#4f617c" font-size="16" font-weight="400">15-5 overlap</text><text x="985" y="1210" fill="#172b4d" font-size="18" font-weight="400">总体低阈值可解释APT的大部分收益</text><rect x="36" y="1283" width="1368" height="170" rx="9" fill="#eaf1ff"/><text x="57" y="1318" fill="#2458c6" font-size="23" font-weight="650">RW-C-RLS  可靠性加权：overlap 70.7979%；disjoint 69.5711%</text><text x="57" y="1350" fill="#172b4d" font-size="19" font-weight="400">论文无对应15-5结果；相对本组不加权对照，平均收益小，旧新类权衡明显。</text><text x="57" y="1392" fill="#2458c6" font-size="23" font-weight="650">CV / Tail-ε  独立验证与初始化：59.7310%<tspan baseline-shift="super" font-size="60%">*</tspan> / 59.7143%<tspan baseline-shift="super" font-size="60%">*</tspan></text><text x="57" y="1427" fill="#172b4d" font-size="19" font-weight="400">论文无同评价集结果；decoder优于aspp，减小初始化幅度未提升。</text><rect x="36" y="1475" width="1368" height="118" rx="9" fill="#e6f3ef"/><text x="57" y="1512" fill="#087f75" font-size="24" font-weight="650">后续保留：PGH-RHL 原型引导混合特征 → BOA 1.5 正交复核</text><text x="57" y="1555" fill="#087f75" font-size="23" font-weight="400">次级储备：PowerNorm 幅值保留归一化；CA-C-RLS 类别感知加权</text><text x="36" y="1630" fill="#4f617c" font-size="17" font-weight="400">* 当前同步记录仅保留JSON结果。图中为最佳单次配置；多seed比较见对应方法小节。</text></svg>